name: partfinder_mobile
description: "App móvil para consultar patentes chilenas conectada a PartFinder 360"
publish_to: "none"
version: 1.3.13+17

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.15.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.2
  open_filex: ^4.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/partfinder360_play_512.png"
  adaptive_icon_background: "#0a0e17"
  adaptive_icon_foreground: "assets/branding/partfinder360_foreground.png"

flutter:
  uses-material-design: true
