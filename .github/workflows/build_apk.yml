name: Build and Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Generate Clean Flutter Project & Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ../backup
          cp lib/main.dart ../backup/
          cp pubspec.yaml ../backup/

          cd ..
          flutter create partfinder_mobile --org com.partfinder360 --platforms=android
          cd partfinder_mobile

          cp ../backup/main.dart lib/
          cp ../backup/pubspec.yaml .

          # Restaurar el script de parcheo al proyecto limpio y ejecutarlo
          cp ../../partfinder-mobile/patch_project.py .
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat << 'KEYPROP' > android/key.properties
storePassword=partfinder123
keyPassword=partfinder123
keyAlias=partfinder
storeFile=release.keystore
KEYPROP
          fi

          python3 patch_project.py

          flutter pub get
          flutter build apk --release

      - name: Release APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "PartFinder Mobile v1.0.${{ github.run_number }}"
          body: "Versión compilada con script Python externo, permiso de internet y firma persistente."
          files: /home/runner/work/partfinder-mobile/partfinder_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
