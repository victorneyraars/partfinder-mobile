name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Create Native Android Support Structure
        run: |
          # Respaldar nuestro código y pubspec.yaml
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/
          cp pubspec.yaml temp_backup/
          
          # Crear proyecto limpio usando guion bajo
          cd ..
          flutter create partfinder_mobile --org com.partfinder360 --platforms=android
          
          # Restaurar el código personalizado
          cd partfinder_mobile
          cp ../partfinder-mobile/temp_backup/main.dart lib/
          cp ../partfinder-mobile/temp_backup/pubspec.yaml .
          
          # Actualizar correctamente el nombre en pubspec.yaml usando comillas seguras
          sed -i "s/^name:.*/name: partfinder_mobile/" pubspec.yaml

      - name: Install Dependencies
        run: |
          cd ../partfinder_mobile
          flutter pub get

      - name: Build APK Release
        run: |
          cd ../partfinder_mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ../partfinder_mobile/build/app/outputs/flutter-apk/app-release.apk
