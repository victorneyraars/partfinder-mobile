name: Build and Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Build APK
        run: |
          mkdir -p ../backup
          cp lib/main.dart ../backup/
          cp pubspec.yaml ../backup/

          cd ..
          flutter create partfinder_mobile --org com.partfinder360 --platforms=android
          cd partfinder_mobile

          cp ../backup/main.dart lib/
          cp ../backup/pubspec.yaml .

          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          flutter pub get
          flutter build apk --release

          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Create Release with GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.$(date +%s)"
          gh release create "$TAG" ../app-release.apk \
            --title "PartFinder Mobile $TAG" \
            --notes "APK estable con permisos de red y subida garantizada."
