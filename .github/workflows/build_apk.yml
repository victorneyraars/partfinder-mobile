name: Build and Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Generate Clean Flutter Project & Build APK
        run: |
          mkdir -p ../backup
          cp lib/main.dart ../backup/
          cp pubspec.yaml ../backup/

          cd ..
          flutter create partfinder_mobile --org com.partfinder360 --platforms=android

          cd partfinder_mobile
          cp ../backup/main.dart lib/
          cp ../backup/pubspec.yaml .

          # Habilitar tráfico HTTP (Cleartext Traffic) de forma segura reemplazando la etiqueta application
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          flutter pub get
          flutter build apk --release

      - name: Release APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "PartFinder Mobile v1.0.${{ github.run_number }}"
          body: "Nueva versión con soporte para conexiones HTTP hacia el servidor en el VPS."
          files: /home/runner/work/partfinder-mobile/partfinder_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
