name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Create Native Android Support Structure
        run: |
          # Respaldar nuestro main.dart y pubspec.yaml
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/
          cp pubspec.yaml temp_backup/
          
          # Borrar la carpeta actual y crear un proyecto Flutter oficial limpio con Gradle y estructura nativa
          cd ..
          flutter create partfinder-mobile --org com.partfinder360 --platforms=android
          
          # Restaurar nuestro código y dependencias personalizados
          cd partfinder-mobile
          cp temp_backup/main.dart lib/
          cp temp_backup/pubspec.yaml .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
