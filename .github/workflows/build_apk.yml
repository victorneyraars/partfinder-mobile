name: Build and Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Create Platform, Keystore and Build
        run: |
          # 1. Asegurar nombre válido en pubspec.yaml
          sed -i 's/^name:.*/name: partfinder_mobile/' pubspec.yaml

          # 2. Crear estructura nativa especificando explícitamente el nombre del proyecto
          flutter create --project-name partfinder_mobile --org com.partfinder360 --platforms=android --overwrite .

          # 3. Generar keystore permanente para la app
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias partfinder-key -storepass partfinder2026 -keypass partfinder2026 -dname "CN=PartFinder360, OU=Mobile, O=PartFinder, L=Santiago, ST=Santiago, C=CL"
          
          # 4. Crear archivo key.properties
          cat << 'PROPS' > android/key.properties
          storePassword=partfinder2026
          keyPassword=partfinder2026
          keyAlias=partfinder-key
          storeFile=upload-keystore.jks
          PROPS

          # 5. Inyectar signingConfig en build.gradle
          python3 -c "
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()

          config_block = '''
          def keystorePropertiesFile = rootProject.file(\"key.properties\")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  release {
                      if (keystoreProperties.hasProperty('storeFile')) {
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
          '''

          if 'key.properties' not in content:
              content = content.replace('android {', config_block)
              content = content.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }')
              with open(gradle_path, 'w') as f:
                  f.write(content)
          "

          # 6. Inyectar permisos y consultas en AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name=\"android.permission.INTERNET\"\/>\n    <application android:usesCleartextTraffic=\"true\"/' "$MANIFEST_PATH"
          
          python3 -c "
          path = '$MANIFEST_PATH'
          with open(path, 'r') as f:
              content = f.read()
          queries_block = '''
          <queries>
              <intent>
                  <action android:name=\"android.intent.action.VIEW\" />
                  <data android:scheme=\"http\" />
              </intent>
              <intent>
                  <action android:name=\"android.intent.action.VIEW\" />
                  <data android:scheme=\"https\" />
              </intent>
          </queries>
          </manifest>'''
          content = content.replace('</manifest>', queries_block)
          with open(path, 'w') as f:
              f.write(content)
          "

          # 7. Compilar APK release firmado
          flutter pub get
          flutter build apk --release

      - name: Release APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "PartFinder Mobile v1.2.${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
