name: Build and Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Build APK Clean
        run: |
          mkdir -p ../backup
          cp lib/main.dart ../backup/
          cp pubspec.yaml ../backup/
          cd ..
          flutter create partfinder_mobile --org com.partfinder360 --platforms=android
          cd partfinder_mobile
          cp ../backup/main.dart lib/
          cp ../backup/pubspec.yaml .
          
          # Inyectar permisos de red, cleartext traffic y queries para url_launcher en AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"
          
          python3 -c "
          path = '$MANIFEST_PATH'
          with open(path, 'r') as f:
              content = f.read()
          queries_block = '''
          <queries>
              <intent>
                  <action android:name=\"android.intent.action.VIEW\" />
                  <data android:scheme=\"http\" />
              </intent>
              <intent>
                  <action android:name=\"android.intent.action.VIEW\" />
                  <data android:scheme=\"https\" />
              </intent>
          </queries>
          </manifest>'''
          content = content.replace('</manifest>', queries_block)
          with open(path, 'w') as f:
              f.write(content)
          "

          flutter pub get
          flutter build apk --release

      - name: Release APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "PartFinder Mobile v1.2.${{ github.run_number }}"
          files: /home/runner/work/partfinder-mobile/partfinder_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
