name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Generate Clean Flutter Project & Build APK
        run: |
          # 1. Guardar nuestro código fuente actual y pubspec
          mkdir -p ../backup
          cp lib/main.dart ../backup/
          cp pubspec.yaml ../backup/

          # 2. Salir de la carpeta y crear un proyecto Flutter totalmente limpio con el nombre y organización correctos
          cd ..
          flutter create partfinder_mobile --org com.partfinder360 --platforms=android

          # 3. Mover nuestro código personalizado al proyecto limpio
          cd partfinder_mobile
          cp ../backup/main.dart lib/
          cp ../backup/pubspec.yaml .

          # 4. Instalar dependencias y compilar el APK de liberación
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ../partfinder_mobile/build/app/outputs/flutter-apk/app-release.apk
