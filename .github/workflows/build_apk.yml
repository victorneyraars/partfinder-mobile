name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Platform, Keystore and Build
        run: |
          # 1. Crear estructura nativa de Android
          flutter create --project-name partfinder360 --org com.studiodigital360 --platforms=android --overwrite .

          # 2. Restaurar código real de lib/ y pubspec
          git checkout -- lib/ pubspec.yaml

          # 3. Copiar el keystore permanente
          mkdir -p android/app
          cp keystore/upload-keystore.jks android/app/upload-keystore.jks

          # 4. Inyectar firmas y permisos mediante script Python
          python3 patch_android.py

          # 5. Compilar artefactos oficiales de Google Play
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
          echo "applicationId aplicado:"
          grep -R "applicationId" android/app/build.gradle | head -3

          # 6. Validar en pantalla certificado oficial
          echo "================ COMPROBACIÓN DE CERTIFICADO ================"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep "CN=PartFinder360"
          echo "=============================================================="

      - name: Release APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_id }}
          name: PartFinder 360 v1.2.${{ github.run_id }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
