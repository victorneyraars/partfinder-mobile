name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Create Native Android Support Structure
        run: |
          # Respaldar nuestro código y pubspec.yaml
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/
          cp pubspec.yaml temp_backup/
          
          # Crear proyecto limpio usando guion bajo (requisito de Dart)
          cd ..
          flutter create partfinder_mobile --org com.partfinder360 --platforms=android
          
          # Restaurar el código personalizado adaptando el nombre del paquete
          cd partfinder_mobile
          cp ../partfinder-mobile/temp_backup/main.dart lib/
          cp ../partfinder-mobile/temp_backup/pubspec.yaml .
          
          # Actualizar el nombre en pubspec.yaml a partfinder_mobile
          sed -i s/name:
