name: Build and Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Generate Clean Flutter Project & Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ../backup
          cp lib/main.dart ../backup/
          cp pubspec.yaml ../backup/

          cd ..
          flutter create partfinder_mobile --org com.partfinder360 --platforms=android
          cd partfinder_mobile

          cp ../backup/main.dart lib/
          cp ../backup/pubspec.yaml .

          # Agregar permiso de internet de forma segura con sed
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          # Configurar firma persistente si existe el secreto
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat << 'KEYPROP' > android/key.properties
storePassword=partfinder123
keyPassword=partfinder123
keyAlias=partfinder
storeFile=release.keystore
KEYPROP

            sed -i '/buildTypes {/i \
    signingConfigs {\
        release {\
            storeFile file("release.keystore")\
            storePassword "partfinder123"\
            keyAlias "partfinder"\
            keyPassword "partfinder123"\
        }\
    }' android/app/build.gradle
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' android/app/build.gradle
          fi

          flutter pub get
          flutter build apk --release

      - name: Release APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "PartFinder Mobile v1.0.${{ github.run_number }}"
          body: "Versión estable con permisos de red y firma persistente."
          files: partfinder_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
