<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="pfGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0a0e17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo corporativo oscuro (cuadrado, sin esquinas redondeadas) -->
  <rect width="512" height="512" fill="#0a0e17"/>
  <rect width="512" height="512" fill="url(#pfGlow)"/>

  <!-- Anillos de pulso (cian y verde desfasados) -->
  <circle cx="256" cy="238" r="150" fill="none" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="4"/>
  <circle cx="256" cy="238" r="178" fill="none" stroke="#10B981" stroke-opacity="0.20" stroke-width="3"/>

  <!-- Emblema circular con gradiente corporativo -->
  <circle cx="256" cy="238" r="118" fill="#0f172a" stroke="url(#pfGrad)" stroke-width="10"/>

  <!-- Arco del velocímetro (apertura inferior, 240°) -->
  <path d="M 178 193 A 90 90 0 1 1 334 193" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <!-- Arco de progreso en gradiente cian→verde -->
  <path d="M 178 193 A 90 90 0 1 1 301 316" fill="none" stroke="url(#pfGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Aguja -->
  <line x1="256" y1="238" x2="289" y2="295" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round"/>
  <circle cx="256" cy="238" r="13" fill="#F8FAFC"/>

  <!-- Wordmark -->
  <text x="256" y="436" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="64" font-weight="bold" letter-spacing="6" fill="#F8FAFC">360</text>
  <text x="256" y="478" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="10" fill="#64748B">PARTFINDER</text>
</svg>
